[package]
name = "m2-rustypipe-spike"
version = "0.1.0"
edition = "2021"
publish = false
description = "M2 go/no-go spike: can rustypipe (pure-Rust InnerTube) replace the yt-dlp binary for search + stream resolution? See PLAN.md §6 M2."

[dependencies]
rustypipe = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
anyhow = "1"
